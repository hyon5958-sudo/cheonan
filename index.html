<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>오늘 운동 뭐하지? 사다리타기</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#18212f;
    --muted:#6b7280;
    --line:#d7dce5;
    --primary:#ff5a5f;
    --primary-dark:#e6454b;
    --accent:#ffd166;
    --shadow:0 14px 34px rgba(24,33,47,.08);
    --radius:22px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:linear-gradient(180deg,#fff 0,#f8f8fb 34%,#f3f5f9 100%);
    color:var(--text);
  }
  .wrap{max-width:1120px;margin:0 auto;padding:32px 20px 56px}
  .hero{
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    margin-bottom:22px;
  }
  .eyebrow{font-size:13px;font-weight:800;color:var(--primary);letter-spacing:.08em;text-transform:uppercase}
  h1{margin:8px 0 10px;font-size:clamp(28px,5vw,48px);line-height:1.08}
  .desc{margin:0;color:var(--muted);font-size:15px;line-height:1.7;max-width:720px}
  .badge{background:#fff;border:1px solid #eceff4;border-radius:999px;padding:10px 14px;font-size:13px;color:#4b5563;box-shadow:var(--shadow);white-space:nowrap}

  .grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
  .card{background:var(--card);border:1px solid #eceff4;border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel{padding:20px}
  .panel h2{font-size:18px;margin:0 0 6px}
  .panel p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}

  .option-list{display:grid;gap:10px}
  .option-row{display:grid;grid-template-columns:38px 1fr 34px;gap:8px;align-items:center}
  .num{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#fff2f2;color:var(--primary);font-weight:800;font-size:13px}
  input[type="text"]{width:100%;border:1px solid #dfe3ea;border-radius:12px;padding:11px 12px;font-size:14px;outline:none;transition:.2s;background:#fff}
  input[type="text"]:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(255,90,95,.12)}
  .remove{border:0;background:#f4f5f8;color:#6b7280;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px}
  .remove:hover{background:#eceef2}
  .row-actions{display:flex;gap:10px;margin-top:14px}
  button{font:inherit}
  .btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.secondary{background:#f1f3f7;color:#374151}
  .btn.primary{background:var(--primary);color:#fff;box-shadow:0 10px 22px rgba(255,90,95,.25)}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

  .game-card{padding:18px;position:relative;overflow:hidden}
  .toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
  .toolbar-left{display:flex;gap:8px;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--muted)}

  .ladder-shell{position:relative;min-height:510px;border-radius:18px;background:
    radial-gradient(circle at 15% 15%,rgba(255,209,102,.22),transparent 26%),
    radial-gradient(circle at 85% 10%,rgba(255,90,95,.12),transparent 22%),
    #fbfcfe;
    border:1px solid #edf0f4;overflow:hidden;
  }
  canvas{display:block;width:100%;height:510px}
  .labels{position:absolute;left:0;right:0;pointer-events:none}
  .labels.top{top:10px}.labels.bottom{bottom:10px}
  .label-item{position:absolute;transform:translateX(-50%);max-width:130px;text-align:center;font-size:12px;font-weight:800;padding:7px 9px;border-radius:999px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 4px 12px rgba(0,0,0,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .labels.top .label-item{color:#374151}
  .labels.bottom .label-item{color:#111827;background:#fff7e6;border-color:#ffe4a3}

  .result{margin-top:14px;border-radius:18px;padding:16px 18px;background:#fff7f7;border:1px solid #ffd8da;display:none;align-items:center;justify-content:space-between;gap:14px}
  .result.show{display:flex;animation:pop .35s ease}
  .result strong{font-size:20px;color:var(--primary)}
  .result small{display:block;color:var(--muted);margin-top:4px}
  .result .emoji{font-size:34px}

  .notice{margin-top:14px;font-size:12px;color:#6b7280;line-height:1.6;background:#f7f8fa;padding:12px 14px;border-radius:14px}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

  @media (max-width:860px){
    .hero{align-items:flex-start;flex-direction:column}.badge{white-space:normal}
    .grid{grid-template-columns:1fr}
    .ladder-shell{min-height:470px}canvas{height:470px}
  }
  @media (max-width:560px){
    .wrap{padding:22px 12px 36px}
    .panel,.game-card{padding:14px}
    .toolbar{align-items:flex-start;flex-direction:column}
    .row-actions{display:grid;grid-template-columns:1fr 1fr}
    .btn{width:100%}
    .result{align-items:flex-start}
    .label-item{font-size:10px;max-width:86px;padding:6px 7px}
    .ladder-shell{min-height:430px}canvas{height:430px}
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">Workout Picker</div>
      <h1>오늘 운동 뭐하지? 🏃‍♀️</h1>
      <p class="desc">운동 후보를 넣고 사다리를 새로 만든 뒤, 시작 버튼을 눌러 오늘의 운동을 재미있게 골라보세요.</p>
    </div>
    <div class="badge">최대 6개 후보 · 모바일 지원</div>
  </section>

  <main class="grid">
    <section class="card panel">
      <h2>운동 후보</h2>
      <p>2~6개의 운동을 입력할 수 있어요. 이름은 자유롭게 수정하세요.</p>
      <div id="optionList" class="option-list"></div>
      <div class="row-actions">
        <button id="addBtn" class="btn secondary">+ 후보 추가</button>
        <button id="shuffleBtn" class="btn secondary">사다리 새로 만들기</button>
      </div>
      <div style="margin-top:10px">
        <button id="startBtn" class="btn primary" style="width:100%">오늘 운동 뽑기</button>
      </div>
      <div class="notice">이 결과는 재미를 위한 무작위 선택입니다. 통증, 컨디션, 회복 상태가 좋지 않다면 결과와 관계없이 강도를 조절하거나 휴식을 선택하세요.</div>
    </section>

    <section class="card game-card">
      <div class="toolbar">
        <div class="toolbar-left">
          <span class="hint">위에서 한 줄을 무작위로 골라 사다리를 따라갑니다.</span>
        </div>
        <span class="hint" id="statusText">준비 완료</span>
      </div>
      <div class="ladder-shell" id="ladderShell">
        <div class="labels top" id="topLabels"></div>
        <canvas id="ladderCanvas"></canvas>
        <div class="labels bottom" id="bottomLabels"></div>
      </div>
      <div id="resultBox" class="result">
        <div>
          <div style="font-size:13px;color:#6b7280;margin-bottom:3px">오늘의 운동</div>
          <strong id="resultText">러닝</strong>
          <small>가볍게 몸을 풀고 시작해보세요.</small>
        </div>
        <div class="emoji">🎉</div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const defaultOptions = ["러닝", "근력 운동", "요가", "자전거", "걷기"];
  const state = { options:[...defaultOptions], rungs:[], animating:false };

  const optionList = document.getElementById('optionList');
  const addBtn = document.getElementById('addBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const startBtn = document.getElementById('startBtn');
  const canvas = document.getElementById('ladderCanvas');
  const shell = document.getElementById('ladderShell');
  const topLabels = document.getElementById('topLabels');
  const bottomLabels = document.getElementById('bottomLabels');
  const resultBox = document.getElementById('resultBox');
  const resultText = document.getElementById('resultText');
  const statusText = document.getElementById('statusText');
  const ctx = canvas.getContext('2d');

  function syncOptionsFromInputs(){
    const inputs = [...optionList.querySelectorAll('input')];
    state.options = inputs.map((el,i)=>el.value.trim() || `운동 ${i+1}`);
  }

  function renderOptionInputs(){
    optionList.innerHTML = '';
    state.options.forEach((name, idx) => {
      const row = document.createElement('div');
      row.className = 'option-row';
      row.innerHTML = `
        <div class="num">${idx+1}</div>
        <input type="text" maxlength="18" value="${name.replace(/"/g,'&quot;')}" aria-label="운동 후보 ${idx+1}">
        <button class="remove" title="삭제" aria-label="운동 후보 삭제">×</button>`;
      const input = row.querySelector('input');
      input.addEventListener('input', () => { syncOptionsFromInputs(); renderLabels(); });
      row.querySelector('.remove').addEventListener('click', () => {
        if(state.options.length <= 2) return alert('운동 후보는 최소 2개가 필요해요.');
        syncOptionsFromInputs();
        state.options.splice(idx,1);
        renderOptionInputs();
        generateLadder();
      });
      optionList.appendChild(row);
    });
    addBtn.disabled = state.options.length >= 6;
  }

  function dimensions(){
    const rect = shell.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(300, Math.floor(rect.width));
    const height = window.innerWidth <= 560 ? 430 : window.innerWidth <= 860 ? 470 : 510;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return {width,height};
  }

  function xPositions(width){
    const n = state.options.length;
    const left = Math.min(62, width * .11);
    const right = width - left;
    if(n===1) return [width/2];
    return Array.from({length:n},(_,i)=>left + (right-left)*i/(n-1));
  }

  function generateLadder(){
    syncOptionsFromInputs();
    state.rungs = [];
    const n = state.options.length;
    const levels = Math.max(8, n * 3);
    for(let level=0; level<levels; level++){
      const used = new Set();
      for(let col=0; col<n-1; col++){
        if(used.has(col) || used.has(col+1)) continue;
        if(Math.random() < 0.45){
          state.rungs.push({level,col});
          used.add(col); used.add(col+1);
        }
      }
    }
    if(state.rungs.length < n){
      for(let col=0; col<n-1; col++) state.rungs.push({level:col+2,col});
    }
    resultBox.classList.remove('show');
    statusText.textContent = '새 사다리 준비 완료';
    drawBase();
  }

  function renderLabels(){
    syncOptionsFromInputs();
    const {width} = dimensions();
    const xs = xPositions(width);
    topLabels.innerHTML = bottomLabels.innerHTML = '';
    state.options.forEach((name,i)=>{
      ['top','bottom'].forEach(where=>{
        const el=document.createElement('div');
        el.className='label-item';
        el.style.left = xs[i] + 'px';
        el.textContent = where==='top' ? `${i+1}번` : name;
        (where==='top'?topLabels:bottomLabels).appendChild(el);
      });
    });
  }

  function drawBase(){
    const {width,height} = dimensions();
    const xs = xPositions(width);
    const top = 58, bottom = height - 58;
    ctx.clearRect(0,0,width,height);
    ctx.lineCap='round';
    ctx.lineWidth=4;
    ctx.strokeStyle='#d9dee7';
    xs.forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bottom); ctx.stroke(); });
    const maxLevel = Math.max(1, ...state.rungs.map(r=>r.level));
    ctx.lineWidth=4;
    ctx.strokeStyle='#bcc4d0';
    state.rungs.forEach(r=>{
      const y = top + (bottom-top) * (r.level+1)/(maxLevel+2);
      ctx.beginPath(); ctx.moveTo(xs[r.col],y); ctx.lineTo(xs[r.col+1],y); ctx.stroke();
    });
    renderLabels();
  }

  function buildPath(startCol){
    const {width,height}=dimensions();
    const xs=xPositions(width);
    const top=58,bottom=height-58;
    const maxLevel=Math.max(1,...state.rungs.map(r=>r.level));
    const rungs=[...state.rungs].sort((a,b)=>a.level-b.level);
    let col=startCol;
    const points=[{x:xs[col],y:top}];
    let currentY=top;
    rungs.forEach(r=>{
      const y = top + (bottom-top) * (r.level+1)/(maxLevel+2);
      if(r.col===col || r.col+1===col){
        points.push({x:xs[col],y});
        if(r.col===col) col++; else col--;
        points.push({x:xs[col],y});
        currentY=y;
      }
    });
    points.push({x:xs[col],y:bottom});
    return {points,endCol:col};
  }

  function animatePath(points, onDone){
    const {width,height}=dimensions();
    let seg=0, progress=0;
    const speed=0.055;
    function frame(){
      drawBase();
      ctx.lineWidth=7; ctx.strokeStyle='#ff5a5f'; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(points[0].x,points[0].y);
      for(let i=0;i<seg;i++) ctx.lineTo(points[i+1].x,points[i+1].y);
      if(seg<points.length-1){
        const a=points[seg], b=points[seg+1];
        const x=a.x+(b.x-a.x)*progress;
        const y=a.y+(b.y-a.y)*progress;
        ctx.lineTo(x,y);
      }
      ctx.stroke();
      if(seg<points.length-1){
        progress += speed;
        if(progress>=1){ progress=0; seg++; }
        requestAnimationFrame(frame);
      } else onDone();
    }
    frame();
  }

  function pickWorkout(){
    if(state.animating) return;
    syncOptionsFromInputs();
    if(state.options.length<2) return;
    state.animating=true;
    startBtn.disabled=shuffleBtn.disabled=addBtn.disabled=true;
    resultBox.classList.remove('show');
    statusText.textContent='사다리 타는 중...';
    const startCol=Math.floor(Math.random()*state.options.length);
    const {points,endCol}=buildPath(startCol);
    animatePath(points,()=>{
      state.animating=false;
      startBtn.disabled=false; shuffleBtn.disabled=false; addBtn.disabled=state.options.length>=6;
      resultText.textContent=state.options[endCol];
      resultBox.classList.add('show');
      statusText.textContent=`${startCol+1}번 출발 → ${endCol+1}번 도착`;
      if(navigator.vibrate) navigator.vibrate([60,40,90]);
    });
  }

  addBtn.addEventListener('click',()=>{
    syncOptionsFromInputs();
    if(state.options.length>=6) return;
    state.options.push(`운동 ${state.options.length+1}`);
    renderOptionInputs(); generateLadder();
  });
  shuffleBtn.addEventListener('click',()=>{ if(!state.animating) generateLadder(); });
  startBtn.addEventListener('click',pickWorkout);
  window.addEventListener('resize',()=>{ if(!state.animating) drawBase(); });

  renderOptionInputs();
  generateLadder();
})();
</script>
</body>
</html>
